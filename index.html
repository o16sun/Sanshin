<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三線タブ譜 変換ツール（入門用）</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #ffffff;
      --ink: #1e1e1e;
      --muted: #666666;
      --accent: #b83a2d;
      --accent-hover: #992c21;
      --border: #dcd6ca;
      --line-dark: #222222;
      --line-dot: #888888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    header .sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover {
      background: #f0ece3;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
    }

    .container {
      max-width: 1380px;
      margin: 18px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 960px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.92rem;
      margin-bottom: 12px;
      background: #fff;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: -6px;
      margin-bottom: 12px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-row button {
      flex: 1;
    }

    /* 楽譜シート */
    .sheet-wrapper {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      overflow-x: auto;
    }

    .sheet {
      width: 794px;
      min-height: 1123px;
      margin: 0 auto;
      background: #fff;
      padding: 28px 34px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .sheet-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      margin-bottom: 4px;
    }

    .sheet-meta {
      text-align: right;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .beat-header {
      display: grid;
      grid-template-columns: 36px repeat(12, 1fr);
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .staff-block {
      position: relative;
      margin-bottom: 14px;
    }

    .staff-labels {
      position: absolute;
      left: 0;
      top: 12px;
      width: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 52px;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
    }

    .staff-grid {
      margin-left: 36px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      border-right: 1px solid var(--line-dark);
      position: relative;
    }

    .beat-cell {
      height: 76px;
      position: relative;
      border-left: 1px dotted var(--line-dot);
      user-select: none;
    }

    .beat-cell:nth-child(4n + 1) {
      border-left: 1px solid var(--line-dark);
    }

    .string-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--line-dark);
      pointer-events: none;
    }

    .string-line.jo { top: 18px; }
    .string-line.chu { top: 38px; }
    .string-line.otsu { top: 58px; }

    .note-mark {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 0.86rem;
      font-weight: 700;
      line-height: 1;
      z-index: 2;
      pointer-events: none;
      white-space: nowrap;
    }

    .note-mark.open-dot {
      font-size: 0.96rem;
    }

    .high-badge {
      font-size: 0.62rem;
      vertical-align: super;
      margin-left: 1px;
      color: var(--accent);
    }

    .lyric-text {
      position: absolute;
      bottom: 1px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #333;
      white-space: nowrap;
      pointer-events: none;
    }

    .legend {
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    @media print {
      body {
        background: #fff;
      }
      header,
      .controls-col,
      .legend {
        display: none !important;
      }
      .container {
        display: block;
        max-width: none;
        margin: 0;
        padding: 0;
      }
      .sheet-wrapper {
        border: none;
        padding: 0;
        overflow: visible;
      }
      .sheet {
        width: 100%;
        min-height: auto;
        box-shadow: none;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>三線タブ譜 変換ツール（入門用）</h1>
      <div class="sub">工工四・ドレミ・C〜Bを入れて変換／A4印刷・PNG保存</div>
    </div>
    <div class="header-actions">
      <button id="btnPrint" class="primary">A4印刷 / PDF</button>
      <button id="btnSavePng">画像保存 (PNG)</button>
    </div>
  </header>

  <main class="container">
    <section class="controls-col">
      <div class="card">
        <h2>楽譜をつくる</h2>

        <label for="songTitle">曲名</label>
        <input type="text" id="songTitle" value="てぃんさぐぬ花" />

        <label for="inputMode">入力形式</label>
        <select id="inputMode">
          <option value="auto">自動判別（工工四・ドレミ・C〜B）</option>
          <option value="kunkunshi">工工四（合 乙 老 四 上 中 尺 工 五 六 七 八）</option>
          <option value="doremi">ドレミ（低いド＝ド / 高いド＝ド↑）</option>
          <option value="pitch">英語音名（低いド＝C / 高いド＝C↑）</option>
        </select>

        <label for="bulkInput">音符（スペースや改行区切り）</label>
        <textarea id="bulkInput" placeholder="例：中 中 工 尺 中 上 四 老 四 中 中 尺"></textarea>
        <div class="hint">
          1拍に2音入れる場合は「中尺」「ラソ」のように続けて書きます。高いドは「ド↑」「高ド」「C↑」で指定できます。
        </div>

        <label for="bulkLyrics">歌詞（任意・スペース区切り）</label>
        <input type="text" id="bulkLyrics" placeholder="例：てぃ ん さ ぐ ぬ は な や ち み さ ち" />

        <div class="btn-row">
          <button id="btnConvert" class="primary">楽譜に変換</button>
          <button id="btnResetSample">サンプル</button>
        </div>
        <div class="btn-row">
          <button id="btnClear">入力をクリア</button>
        </div>
      </div>
    </section>

    <section class="sheet-wrapper">
      <div id="sheet" class="sheet">
        <div id="displayTitle" class="sheet-title">てぃんさぐぬ花</div>
        <div class="sheet-meta">上線：女弦 ／ 中線：中弦 ／ 下線：男弦（●＝開放 ／ ◎＝高いド開放 ／ ↑＝高音）</div>
        <div id="scoreContainer"></div>
        <div class="legend">
          <span><strong>女弦（上・高音）</strong>：工(◎・高ド) / 五(人↑) / 六(中↑) / 七(小↑) / 八(八↑)</span>
          <span><strong>中弦（中）</strong>：四(●) / 上(人) / 中(中) / 尺(小)</span>
          <span><strong>男弦（下・低音）</strong>：合(●・低ド) / 乙(人) / 老(中)</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const NOTE_DEFS = [
      { k: "合", line: "otsu", symbol: "●", isOpen: true,  isHigh: false, doremi: "ド",   pitch: "C" },
      { k: "乙", line: "otsu", symbol: "人", isOpen: false, isHigh: false, doremi: "レ",   pitch: "D" },
      { k: "老", line: "otsu", symbol: "中", isOpen: false, isHigh: false, doremi: "ミ",   pitch: "E" },
      { k: "四", line: "chu",  symbol: "●", isOpen: true,  isHigh: false, doremi: "ファ", pitch: "F" },
      { k: "上", line: "chu",  symbol: "人", isOpen: false, isHigh: false, doremi: "ソ",   pitch: "G" },
      { k: "中", line: "chu",  symbol: "中", isOpen: false, isHigh: false, doremi: "ラ",   pitch: "A" },
      { k: "尺", line: "chu",  symbol: "小", isOpen: false, isHigh: false, doremi: "シ",   pitch: "B" },
      { k: "工", line: "jo",   symbol: "◎", isOpen: true,  isHigh: true,  doremi: "ド↑",  pitch: "C↑" },
      { k: "五", line: "jo",   symbol: "人", isOpen: false, isHigh: true,  doremi: "レ↑",  pitch: "D↑" },
      { k: "六", line: "jo",   symbol: "中", isOpen: false, isHigh: true,  doremi: "ミ↑",  pitch: "E↑" },
      { k: "七", line: "jo",   symbol: "小", isOpen: false, isHigh: true,  doremi: "ファ↑", pitch: "F↑" },
      { k: "八", line: "jo",   symbol: "八", isOpen: false, isHigh: true,  doremi: "ソ↑",  pitch: "G↑" }
    ];

    const BY_KUNKUNSHI = Object.fromEntries(NOTE_DEFS.map((d) => [d.k, d]));

    const ALIAS_ENTRIES = [
      ["ファ↑", "七"], ["ふぁ↑", "七"], ["高ファ", "七"], ["高ふぁ", "七"], ["F↑", "七"], ["f↑", "七"], ["F5", "七"],
      ["ド↑", "工"], ["ど↑", "工"], ["高ド", "工"], ["高ど", "工"], ["C↑", "工"], ["c↑", "工"], ["C5", "工"],
      ["レ↑", "五"], ["れ↑", "五"], ["高レ", "五"], ["高れ", "五"], ["D↑", "五"], ["d↑", "五"], ["D5", "五"],
      ["ミ↑", "六"], ["み↑", "六"], ["高ミ", "六"], ["高み", "六"], ["E↑", "六"], ["e↑", "六"], ["E5", "六"],
      ["ソ↑", "八"], ["そ↑", "八"], ["高ソ", "八"], ["高そ", "八"], ["G↑", "八"], ["g↑", "八"], ["G5", "八"],
      ["ファ♯", "上"], ["ファ#", "上"], ["ド♯", "乙"], ["ド#", "乙"],
      ["レ♯", "老"], ["レ#", "老"], ["ソ♯", "中"], ["ソ#", "中"], ["ラ♯", "尺"], ["ラ#", "尺"],
      ["C#", "乙"], ["C♯", "乙"], ["DB", "乙"], ["Db", "乙"],
      ["D#", "老"], ["D♯", "老"], ["EB", "老"], ["Eb", "老"],
      ["F#", "上"], ["F♯", "上"], ["GB", "上"], ["Gb", "上"],
      ["G#", "中"], ["G♯", "中"], ["AB", "中"], ["Ab", "中"],
      ["A#", "尺"], ["A♯", "尺"], ["BB", "尺"], ["Bb", "尺"],
      ["ファ", "四"], ["ふぁ", "四"],
      ["ド", "合"], ["ど", "合"],
      ["レ", "乙"], ["れ", "乙"],
      ["ミ", "老"], ["み", "老"],
      ["ソ", "上"], ["そ", "上"],
      ["ラ", "中"], ["ら", "中"],
      ["シ", "尺"], ["し", "尺"], ["ティ", "尺"], ["てぃ", "尺"],
      ["C", "合"], ["c", "合"], ["C4", "合"],
      ["D", "乙"], ["d", "乙"], ["D4", "乙"],
      ["E", "老"], ["e", "老"], ["E4", "老"],
      ["F", "四"], ["f", "四"], ["F4", "四"],
      ["G", "上"], ["g", "上"], ["G4", "上"],
      ["A", "中"], ["a", "中"], ["A4", "中"],
      ["B", "尺"], ["b", "尺"], ["B4", "尺"],
      ["合", "合"], ["乙", "乙"], ["老", "老"],
      ["四", "四"], ["上", "上"], ["中", "中"], ["尺", "尺"],
      ["工", "工"], ["五", "五"], ["六", "六"], ["七", "七"], ["八", "八"]
    ].sort((a, b) => b[0].length - a[0].length);

    const ROWS = 6;
    const BEATS = 12;

    function createEmptyScore() {
      return Array.from({ length: ROWS }, () =>
        Array.from({ length: BEATS }, () => ({
          notes: [],
          lyric: ""
        }))
      );
    }

    let scoreData = createEmptyScore();

    function setNotesForCell(cell, kunkunshiList) {
      cell.notes = kunkunshiList
        .map((k) => k.trim())
        .filter((k) => BY_KUNKUNSHI[k])
        .slice(0, 2)
        .map((k) => ({ ...BY_KUNKUNSHI[k] }));
    }

    function parseTokenToKunkunshi(token, mode) {
      const result = [];
      let pos = 0;

      while (pos < token.length) {
        if (mode === "kunkunshi") {
          const ch = token[pos];
          if (BY_KUNKUNSHI[ch]) result.push(ch);
          pos += 1;
          continue;
        }

        let matched = false;
        for (const [alias, k] of ALIAS_ENTRIES) {
          if (token.startsWith(alias, pos)) {
            result.push(k);
            pos += alias.length;
            matched = true;
            break;
          }
        }
        if (!matched) {
          pos += 1;
        }
      }
      return result;
    }

    function convertFromInputs() {
      const mode = document.getElementById("inputMode").value;
      const rawText = document.getElementById("bulkInput").value;
      const rawLyrics = document.getElementById("bulkLyrics").value.trim();

      const tokens = rawText
        .trim()
        .split(/[\s,、/／]+/)
        .filter(Boolean);

      const beatGroups = [];
      tokens.forEach((tok) => {
        const kList = parseTokenToKunkunshi(tok, mode);
        if (kList.length === 0) return;
        for (let i = 0; i < kList.length; i += 2) {
          beatGroups.push(kList.slice(i, i + 2));
        }
      });

      const lyricList = rawLyrics
        ? (/\s/.test(rawLyrics) ? rawLyrics.split(/\s+/) : Array.from(rawLyrics))
        : [];

      const nextScore = createEmptyScore();
      const totalCells = ROWS * BEATS;

      for (let i = 0; i < Math.min(beatGroups.length, totalCells); i++) {
        const r = Math.floor(i / BEATS);
        const c = i % BEATS;
        setNotesForCell(nextScore[r][c], beatGroups[i]);
        if (lyricList[i]) {
          nextScore[r][c].lyric = lyricList[i];
        }
      }

      scoreData = nextScore;
      renderScore();
    }

    function loadSample() {
      document.getElementById("songTitle").value = "てぃんさぐぬ花";
      document.getElementById("bulkInput").value =
        "中 中 工 尺 中 上 四 老 四 中 中 尺\n中 上 四 老 四 四 中 中 尺 中 上 四";
      document.getElementById("bulkLyrics").value =
        "てぃ ん さ ぐ ぬ は な や ち み さ ち う り てぃ ん さ ぐ ぬ は な や ち み";
      convertFromInputs();
    }

    function renderScore() {
      document.getElementById("displayTitle").textContent =
        document.getElementById("songTitle").value.trim() || "無題";

      const container = document.getElementById("scoreContainer");
      container.innerHTML = "";

      for (let r = 0; r < ROWS; r++) {
        const header = document.createElement("div");
        header.className = "beat-header";
        header.innerHTML = `<div></div>` + Array.from({ length: BEATS }, (_, b) => `<div>${b + 1}</div>`).join("");
        container.appendChild(header);

        const block = document.createElement("div");
        block.className = "staff-block";

        const labels = document.createElement("div");
        labels.className = "staff-labels";
        labels.innerHTML = `<div>女</div><div>中</div><div>男</div>`;
        block.appendChild(labels);

        const grid = document.createElement("div");
        grid.className = "staff-grid";

        for (let c = 0; c < BEATS; c++) {
          const cellData = scoreData[r][c];
          const cellEl = document.createElement("div");
          cellEl.className = "beat-cell";

          cellEl.innerHTML = `
            <div class="string-line jo"></div>
            <div class="string-line chu"></div>
            <div class="string-line otsu"></div>
          `;

          const topMap = { jo: 18, chu: 38, otsu: 58 };
          const xPositions = cellData.notes.length === 1 ? [50] : [30, 72];

          cellData.notes.slice(0, 2).forEach((n, idx) => {
            const mark = document.createElement("div");
            mark.className = "note-mark" + (n.isOpen ? " open-dot" : "");
            mark.style.top = `${topMap[n.line]}px`;
            mark.style.left = `${xPositions[idx]}%`;

            if (n.isHigh && !n.isOpen) {
              mark.innerHTML = `${n.symbol}<span class="high-badge">↑</span>`;
            } else {
              mark.textContent = n.symbol;
            }
            cellEl.appendChild(mark);
          });

          if (cellData.lyric) {
            const lyric = document.createElement("div");
            lyric.className = "lyric-text";
            lyric.textContent = cellData.lyric;
            cellEl.appendChild(lyric);
          }

          grid.appendChild(cellEl);
        }

        block.appendChild(grid);
        container.appendChild(block);
      }
    }

    document.getElementById("btnConvert").addEventListener("click", convertFromInputs);
    document.getElementById("btnResetSample").addEventListener("click", loadSample);
    document.getElementById("btnClear").addEventListener("click", () => {
      document.getElementById("bulkInput").value = "";
      document.getElementById("bulkLyrics").value = "";
      scoreData = createEmptyScore();
      renderScore();
    });
    document.getElementById("songTitle").addEventListener("input", renderScore);

    document.getElementById("btnPrint").addEventListener("click", () => {
      window.print();
    });

    document.getElementById("btnSavePng").addEventListener("click", () => {
      const sheet = document.getElementById("sheet");
      const title = (document.getElementById("songTitle").value.trim() || "sanshin-score")
        .replace(/[\\/:*?"<>|]/g, "_");

      const rect = sheet.getBoundingClientRect();
      const width = Math.round(rect.width);
      const height = Math.round(rect.height);

      const cloned = sheet.cloneNode(true);
      cloned.setAttribute("xmlns", "http://www.w3.org/1999/xhtml");

      const styles = Array.from(document.querySelectorAll("style"))
        .map((s) => s.innerHTML)
        .join("\n");

      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">
              <style>${styles}</style>
              ${cloned.outerHTML}
            </div>
          </foreignObject>
        </svg>
      `;

      const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = width * 2;
        canvas.height = height * 2;
        const ctx = canvas.getContext("2d");
        ctx.scale(2, 2);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0);

        URL.revokeObjectURL(url);
        const pngUrl = canvas.toDataURL("image/png");
        const a = document.createElement("a");
        a.href = pngUrl;
        a.download = `${title}.png`;
        a.click();
      };

      img.onerror = () => {
        URL.revokeObjectURL(url);
        alert("PNG出力に失敗しました。A4印刷 / PDFボタンから保存をお試しください。");
      };

      img.src = url;
    });

    loadSample();
  </script>
</body>
</html>
